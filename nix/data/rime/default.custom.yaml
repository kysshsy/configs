patch:
  __include: rime_ice_suggestion:/
  schema_list:
    - schema: double_pinyin_flypy
  # Replace Rime Ice's default bindings. In particular, do not keep its
  # Control+Shift+4 traditionalization shortcut: Toshy maps Cmd to Ctrl on
  # Linux, so that default binding otherwise leaks through as Cmd+Shift+4.
  key_binder/bindings: []
  # Explicitly delete Rime Ice's inherited global toggles. The generated
  # schema may otherwise retain them even when the list above is replaced.
  "key_binder/bindings/@9": null
  "key_binder/bindings/@8": null
  "key_binder/bindings/@7": null
  "key_binder/bindings/@6": null
